<!doctype html>
<html lang="en">
  <head>

      onload="this.media='all'"

      <link
        href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Patrick+Hand&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      html, body, #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #FFF6E5;
        color: #24222D;
        font-family: 'Patrick Hand', 'Comic Sans MS', cursive, sans-serif;
      }
      .boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .boot-fallback-card {
        max-width: 360px;
        width: 100%;
        background: #FFF6E5;
        border: 3.5px solid #24222D;
        border-radius: 22px;
        box-shadow: 0 6px 0 #24222D;
        padding: 20px;
        text-align: center;
      }
      .boot-fallback-title {
        font-size: 1.65rem;
        font-weight: 700;
        margin: 0 0 6px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="paper-vignette"></div>
      <div id="ui-root">
        <div class="boot-fallback">
          <div class="boot-fallback-card">
            <div class="boot-fallback-title">DodSnakes</div>
            <div>Preparing 3D Sketchbook Board...</div>

        </div>

    </div>
    <script type="module" src="/src/main.ts"></script>
