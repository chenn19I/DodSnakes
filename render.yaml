services:
  - type: web
    name: dodsnakes-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@doodle-dash/shared && npm run build --workspace=@doodle-dash/server
    startCommand: npm run start --workspace=@doodle-dash/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://dodsnakes.vercel.app
